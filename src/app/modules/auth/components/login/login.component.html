<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">
            <i class="fas fa-sign-in-alt me-2"></i>
            Iniciar Sesión
          </h4>
        </div>
        
        <div class="card-body p-4">
          <!-- Formulario -->
          <form (ngSubmit)="login()">
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-user"></i>
                </span>
                <input type="text" id="username" class="form-control" 
                       [(ngModel)]="credentials.username" name="username" required
                       placeholder="Ingrese su usuario">
              </div>
            </div>
            
            <!-- Password -->
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-lock"></i>
                </span>
                <input type="password" id="password" class="form-control" 
                       [(ngModel)]="credentials.password" name="password" required
                       placeholder="Ingrese su contraseña">
              </div>
            </div>
            
            <!-- Error message -->
            <div *ngIf="error" class="alert alert-danger mb-3">
              <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
            </div>
            
            <!-- Submit button -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="fas fa-sign-in-alt me-2"></i> Ingresar
              </button>
            </div>
          </form>
          
          <!-- Enlace a registro -->
          <div class="mt-4 text-center">
            <p class="text-muted mb-2">¿No tienes una cuenta?</p>
            <a routerLink="/auth/register" class="btn btn-outline-primary btn-sm">
              <i class="fas fa-user-plus me-2"></i> Registrarse
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
